<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FFCS Slot Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block">
<style>
:root {
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
    margin: 0;
    padding: 0;
    font:
        14px -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    background: #fff;
    color: #000;
}
img {
    max-width: 100%;
}
[hidden]:not([hidden='until-found' i]) {
    display: none !important;
}

/* Layout: sticky top bar with hamburger; left rail = faculty + slot options for the active subject; right = Theory and Lab matrices (days x periods). Hamburger opens a drawer of subjects. */
:root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f8f9fa;
    --line: #dadce0;
    --line-soft: #e8eaed;
    --ink: #202124;
    --ink-2: #5f6368;
    --ink-3: #707479;
    --accent: #1a73e8;
    --accent-ink: #ffffff;
    --accent-wash: #e8f0fe;
    --accent-line: #d2e3fc;
    --ok: #137333;
    --ok-wash: #e6f4ea;
    --ok-line: #ceead6;
    --bad: #c5221f;
    --bad-wash: #fce8e6;
    --bad-line: #f28b82;
    --warn: #8a5300;
    --warn-wash: #fef7e0;
    --warn-line: #fde293;
    --scrim: rgba(32, 33, 36, 0.45);
    --shadow: 0 8px 28px rgba(60, 64, 67, 0.28);
    --f-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
        --bg: #1b1c1f;
        --surface: #222327;
        --surface-2: #1e1f23;
        --line: #3c4043;
        --line-soft: #2f3135;
        --ink: #e8eaed;
        --ink-2: #bdc1c6;
        --ink-3: #9aa0a6;
        --accent: #8ab4f8;
        --accent-ink: #0b2a5b;
        --accent-wash: #1f2b40;
        --accent-line: #2e4468;
        --ok: #81c995;
        --ok-wash: #1b2e22;
        --ok-line: #2b4c37;
        --bad: #f28b82;
        --bad-wash: #3a2120;
        --bad-line: #7a3b37;
        --warn: #fdd663;
        --warn-wash: #342e12;
        --warn-line: #5c4f1a;
        --scrim: rgba(0, 0, 0, 0.6);
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
        color-scheme: dark;
    }
}
:root[data-theme='dark'] {
    --bg: #1b1c1f;
    --surface: #222327;
    --surface-2: #1e1f23;
    --line: #3c4043;
    --line-soft: #2f3135;
    --ink: #e8eaed;
    --ink-2: #bdc1c6;
    --ink-3: #9aa0a6;
    --accent: #8ab4f8;
    --accent-ink: #0b2a5b;
    --accent-wash: #1f2b40;
    --accent-line: #2e4468;
    --ok: #81c995;
    --ok-wash: #1b2e22;
    --ok-line: #2b4c37;
    --bad: #f28b82;
    --bad-wash: #3a2120;
    --bad-line: #7a3b37;
    --warn: #fdd663;
    --warn-wash: #342e12;
    --warn-line: #5c4f1a;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
}
body::before {
    content: '';
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 60;
    background: var(--surface);
}
button,
input,
textarea {
    font: inherit;
    color: inherit;
}
button {
    cursor: pointer;
}
:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}
.ms {
    font-family: 'Material Symbols Outlined', sans-serif;
    font-weight: 400;
    font-style: normal;
    font-size: 20px;
    line-height: 1;
    display: inline-block;
    width: 1em;
    height: 1em;
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: normal;
    text-transform: none;
    direction: ltr;
    font-feature-settings: 'liga';
    -webkit-font-feature-settings: 'liga';
    vertical-align: middle;
    flex: none;
}
.sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
}

/* top bar */
.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
}
.top-in {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    flex-wrap: wrap;
    padding-block: 6px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.icon-btn {
    display: inline-grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-2);
    flex: none;
}
.icon-btn:hover {
    background: var(--line-soft);
    color: var(--ink);
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}
.logo {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--accent-wash);
    border: 1px solid var(--accent-line);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex: none;
}
.brand b {
    font-size: 17px;
    font-weight: 500;
    white-space: nowrap;
}
.crumb {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    font-size: 13px;
    font-weight: 500;
    min-width: 0;
    max-width: 100%;
}
.crumb span.t {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--sc, var(--accent));
    flex: none;
}
.grow {
    flex: 1 1 0;
}
.stat {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    white-space: nowrap;
}
.stat-part,
.stat-clashes {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--accent-line);
    background: var(--accent-wash);
    color: var(--accent);
}
.stat-part {
    position: relative;
    cursor: default;
}
.stat-tooltip {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 70;
    width: max-content;
    max-width: min(280px, 80vw);
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
    white-space: normal;
    font-size: 12px;
    font-weight: 400;
    cursor: default;
}
.stat-part:hover .stat-tooltip,
.stat-part:focus .stat-tooltip {
    display: block;
}
.stat-tooltip b {
    display: block;
    margin-bottom: 3px;
    color: var(--ink);
}
.stat-tooltip ul,
.stat-tooltip p {
    margin: 0 0 8px;
}
.stat-tooltip ul {
    padding-left: 18px;
}
.stat-tooltip li::marker {
    color: var(--sc);
}
.stat-tooltip li {
    overflow-wrap: anywhere;
}
.stat-part.lab {
    border-color: var(--ok-line);
    background: var(--ok-wash);
    color: var(--ok);
}
.stat-clashes {
    border-color: var(--bad-line);
    background: var(--bad-wash);
    color: var(--bad);
}
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
}
.btn:hover {
    background: var(--surface-2);
}
.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
}
.btn.primary:hover {
    filter: brightness(1.07);
}
.btn.sm {
    padding: 4px 10px;
    font-size: 12px;
}
.btn:disabled {
    opacity: 0.5;
    cursor: default;
}
.link {
    background: none;
    border: 0;
    padding: 0;
    color: var(--accent);
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 2px;
}

/* drawer */
.scrim {
    position: fixed;
    inset: 0;
    background: var(--scrim);
    z-index: 70;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s;
}
.scrim.on {
    opacity: 1;
    visibility: visible;
}
.drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 80;
    width: min(340px, 88vw);
    background: var(--surface);
    border-right: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transform: translateX(-102%);
    visibility: hidden;
    transition:
        transform 0.22s ease,
        visibility 0.22s;
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.on {
    transform: none;
    visibility: visible;
}
.d-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 10px 16px;
    border-bottom: 1px solid var(--line-soft);
}
.d-head b {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
}
.d-body {
    flex: 1;
    overflow: auto;
    padding: 8px;
}
.d-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 2px;
}
.d-item {
    display: flex;
    align-items: center;
    gap: 2px;
    border-radius: 10px;
}
.d-item.active {
    background: var(--accent-wash);
}
.d-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 10px 8px 10px 12px;
    border-radius: 10px;
}
.d-main:hover {
    background: var(--line-soft);
}
.d-item.active .d-main:hover {
    background: transparent;
}
.d-t {
    display: grid;
    min-width: 0;
}
.d-t b {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.d-t span {
    font-size: 12px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.d-t span.bad {
    color: var(--bad);
}
.d-add {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line-soft);
    display: grid;
    gap: 8px;
}
.d-reset {
    padding: 0 16px 16px;
    display: flex;
    justify-content: center;
}
.d-empty {
    padding: 20px 12px;
    color: var(--ink-2);
}

.field {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
}
.field:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
}
label.lbl {
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 500;
}

/* layout */
.wrap {
    padding-block: 16px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
    display: grid;
    grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
}
@media (max-width: 900px) {
    .app {
        grid-template-columns: minmax(0, 1fr);
    }
    .panel {
        position: static !important;
        max-height: none !important;
    }
}

/* left panel */
.panel {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 72px);
    max-height: calc(100vh - 88px);
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    min-width: 0;
}
.p-sec {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    display: grid;
    gap: 10px;
}
.p-sec:last-child {
    border-bottom: 0;
}
.eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
}
.p-title {
    display: flex;
    align-items: flex-start;
    gap: 8px;
}
.p-title h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
    text-wrap: balance;
    overflow-wrap: anywhere;
    flex: 1;
    min-width: 0;
}
.code {
    font: 500 12px var(--f-mono);
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 2px 6px;
    display: inline-block;
}
.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.picked {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    border: 1px solid var(--ok-line);
    background: var(--ok-wash);
    color: var(--ok);
    border-radius: 10px;
    min-width: 0;
}
.picked .pk {
    flex: 1;
    min-width: 0;
    display: grid;
}
.picked b {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.picked small {
    font: 400 12px var(--f-mono);
    opacity: 0.9;
}
.none {
    color: var(--ink-2);
    font-size: 13px;
}
.drop {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px;
    border: 1.5px dashed var(--accent);
    border-radius: 10px;
    background: var(--accent-wash);
    color: var(--ink);
}
.drop.over {
    background: var(--accent-line);
}
.drop .ms {
    color: var(--accent);
    font-size: 26px;
}
.drop b {
    font-weight: 500;
    display: block;
}
.drop span.s {
    font-size: 12px;
    color: var(--ink-2);
}
.files {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-2);
}
.files li {
    display: flex;
    gap: 6px;
    align-items: center;
    min-width: 0;
}
.files li span.n {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.busy {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
}
.spin {
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent-line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: sp 0.8s linear infinite;
}
@keyframes sp {
    to {
        transform: rotate(360deg);
    }
}
.note {
    font-size: 12px;
    color: var(--warn);
    background: var(--warn-wash);
    border: 1px solid var(--warn-line);
    border-radius: 8px;
    padding: 8px 10px;
}
.tools {
    display: flex;
    gap: 8px;
    align-items: center;
}
.tools .field {
    flex: 1;
    min-width: 0;
}
.chk {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-2);
}
.chk input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
}
.grp-h {
    display: flex;
    align-items: center;
    gap: 8px;
}
.grp-h .cnt {
    font-size: 12px;
    color: var(--ink-2);
}

.opts {
    display: grid;
    gap: 8px;
}
.opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px 9px 12px;
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    cursor: pointer;
    min-width: 0;
}
.opt:hover {
    border-color: var(--ink-3);
}
.opt.sel {
    border-color: var(--ok);
    background: var(--ok-wash);
}
.opt.bad {
    background: var(--surface-2);
}
.opt.bad .fac {
    color: var(--ink-2);
}
.radio {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--ink-3);
    flex: none;
    display: grid;
    place-items: center;
    align-self: center;
}
.opt.sel .radio {
    border-color: var(--ok);
    background: var(--ok);
}
.opt.sel .radio::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--surface);
}
.o-body {
    flex: 1;
    min-width: 0;
    display: grid;
    gap: 5px;
}
.fac {
    font-weight: 500;
    line-height: 17px;
    transform: translateY(1px);
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.icon-btn.on {
    background: var(--accent-wash);
    color: var(--accent);
}
.star-btn {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    color: var(--ink-3);
    opacity: 0;
    pointer-events: none;
    background: transparent;
    align-self: center;
}
.star-btn:hover {
    background: transparent;
}
.opt:hover .star-btn,
.opt:focus-within .star-btn {
    opacity: 1;
    pointer-events: auto;
}
.icon-btn.star-btn.on,
.icon-btn.star-btn.on:hover,
.icon-btn.star-btn.on:focus-visible {
    color: #fbbc04;
    background: none !important;
    border-radius: 0;
    opacity: 1;
    pointer-events: auto;
    box-shadow: none;
    text-shadow: none;
}
.star-glyph {
    font-family: Arial, sans-serif;
    font-size: 20px;
    line-height: 1;
}
.star-glyph::before {
    content: '☆';
}
.star-btn:not(.on):hover .star-glyph::before,
.star-btn:not(.on):focus-visible .star-glyph::before,
.star-btn.on .star-glyph::before {
    content: '★';
}
.star-btn:not(.on):hover,
.star-btn:not(.on):focus-visible,
.star-btn.on {
    color: #fbbc04;
}
.slots {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 4px;
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
}
.sl {
    white-space: nowrap;
}
.sl {
    font: 500 11px var(--f-mono);
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
}
.opts .opt.bad .slots .sl {
    background: var(--bad-wash);
    border-color: var(--bad-line);
    color: var(--bad);
}
.sl.lab {
    background: var(--accent-wash);
    border-color: var(--accent-line);
    color: var(--accent);
}
.sl.un {
    background: var(--warn-wash);
    border-color: var(--warn-line);
    color: var(--warn);
}
.meta {
    font-size: 12px;
    color: var(--ink-2);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
}
.meta .bad {
    color: var(--bad);
    font-weight: 500;
    display: inline-flex;
    gap: 3px;
    align-items: center;
}
.meta .bad .ms {
    font-size: 14px;
}
.o-act {
    display: flex;
    flex: none;
    align-self: center;
}
.o-act .icon-btn {
    width: 30px;
    height: 30px;
}
.o-act .ms {
    font-size: 18px;

        animation: none !important;
    }

async function loadPreset() {
    const oldSubjects = Array.isArray(cached.subjects) ? cached.subjects : [];
    state.starredOptions = cached.starredOptions || [];
    state.hideClash = !!cached.hideClash;
    const aliases = {
        'Digital Electronics': ['Digital Electronics'],
        'Analog Devices and Circuits': ['Analog Devices and Circuits', 'Analog Digital Circuits'],
        'Introduction to Programming': ['Introduction to Programming'],
        'Applications of Differential and Difference Equations': ['Applications of Differential and Difference Equations', 'Applications of Differential Equations', 'MAT1002'],
        'Professional English': ['Professional English', 'English for Professional Communication'],
        'Chemistry and Environmental Studies': ['Chemistry and Environmental Studies', 'Chemistry'],
        'Indian Studies': ['Indian Studies', 'LIB1023']
    };
    const matched = new Set();
    const subjects = PRESET.map((p, i) => {
        const old = oldSubjects.find(s => !matched.has(s) &&
            ((s.code && s.code === p.code) || (aliases[p.name] || [p.name]).includes(s.name)));
        if (old) matched.add(old);
        const options = p.options.map(o => ({
            id: uid(), faculty: o.faculty, slots: o.slots, venue: o.venue || '', kind: kindOf(o.slots)
        }));
        if (old && Array.isArray(old.options)) {
            if (p.code === 'ECE1012') {
                // Refresh Digital Electronics from the latest VTOP registration PDF.
                // Reuse IDs for unchanged options so existing selections remain valid;
                // obsolete options (including the previous D2/TD2 CB-220 entry) are dropped.
                options.forEach(n => {
                    const prior = old.options.find(o =>
                        facultySlotKey(o) + '|' + (o.venue || '') ===
                        facultySlotKey(n) + '|' + (n.venue || ''));
                    if (prior) n.id = prior.id;
                });
            } else {
                old.options.forEach(o => {
                    const key = facultySlotKey(o) + '|' + (o.venue || '');
                    if (!options.some(n => facultySlotKey(n) + '|' + (n.venue || '') === key))
                        options.push(o);
                });
            }
        }
        return {
            id: old?.id || uid(), name: p.name, code: p.code,
            color: old?.color || COLORS[i % COLORS.length],
            sel: old?.sel || { theory: null, lab: null },
            options
        };
    });
    // Keep unrelated user-created subjects. The legacy "Indian Studies" placeholder
    // remains available because the uploaded file named that way actually contains MAT1002.
    oldSubjects.filter(s => !matched.has(s)).forEach(s => subjects.push(s));
    return { subjects, activeId: cached.activeId && subjects.some(s => s.id === cached.activeId)
        ? cached.activeId : (subjects[0]?.id || null) };
}

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) =>
    String(s == null ? '' : s).replace(
        /[&<>"']/g,
        (c) =>
            ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            })[c]
    );
const active = () => state.subjects.find((s) => s.id === state.activeId) || null;
function label(s) {
    if (s.code) return s.code;
    const w = s.name.split(/\s+/).filter(Boolean);
    if (w.length > 1)
        return (
            w
                .filter((x) => x.length > 2 || w.length < 3)
                .map((x) => x[0])
                .join('')
                .toUpperCase()
                .slice(0, 4) || s.name.slice(0, 5)
        );
    return s.name.slice(0, 6).toUpperCase();
}
function shortName(f) {
    const p = f
        .replace(/\b(Dr|Prof|Mr|Mrs|Ms)\b\.?/gi, '')
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    if (!p.length) return f;
    if (p.length === 1) return p[0];
    return (
        p
            .slice(0, -1)
            .map((x) => x[0].toUpperCase() + '.')
            .join('') +
        ' ' +
        p[p.length - 1]
    );
}
function selectedItems() {
    const r = [];
    state.subjects.forEach((s) =>
        ['theory', 'lab'].forEach((g) => {
            const o = s.options.find((x) => x.id === s.sel[g]);
            if (o) r.push({ subject: s, group: g, opt: o });
        })
    );
    return r;
}
function analyse(skip) {
    const items = selectedItems().filter((it) => !(skip && skip(it))),
        keys = new Set(),
        msgs = [],
        pairs = new Set();
    for (let i = 0; i < items.length; i++)
        for (let j = i + 1; j < items.length; j++) {
            const hits = overlap(items[i].opt, items[j].opt);
            hits.forEach((h) => {
                const x = h[0],
                    y = h[1];
                keys.add(items[i].opt.id + '|' + x.day + '|' + x.slot);
                keys.add(items[j].opt.id + '|' + y.day + '|' + y.slot);
                pairs.add(i + '-' + j);
                const m =
                    label(items[i].subject) +
                    ' ' +
                    x.slot +
                    ' overlaps ' +
                    label(items[j].subject) +
                    ' ' +
                    y.slot +
                    ' on ' +
                    DAYNAME[x.day] +
                    ' ' +
                    fmt(Math.max(x.start, y.start));
                if (msgs.indexOf(m) < 0) msgs.push(m);
            });
        }
    return { items: items, keys: keys, msgs: msgs, count: pairs.size };
}
function conflictFor(subject, group, opt, items) {
    for (let k = 0; k < items.length; k++) {
        const it = items[k];
        if (it.subject.id === subject.id && it.group === group) continue;
        if (it.opt.id === opt.id) continue;
        const h = overlap(opt, it.opt);
        if (h.length)
            return (
                label(it.subject) +
                ' ' +
                h[0][1].slot +
                ' on ' +
                DAYNAME[h[0][0].day] +
                ' ' +
                fmt(Math.max(h[0][0].start, h[0][1].start))
            );
    }
    return null;
}

function chips(opt) {

                (SLOT_INDEX[s] ? '' : ' un') +

                esc(s) +

}
function summaryOf(s) {
    const t = s.options.find((o) => o.id === s.sel.theory),
        l = s.options.find((o) => o.id === s.sel.lab);
    const p = [];
    if (t) p.push(t.slots.join('+') + ' ' + shortName(t.faculty));
    if (l) p.push(l.slots.join('+') + ' ' + shortName(l.faculty));
    return p.join(' · ');
}

        '" title="' +
        (starred ? 'Unstar this option' : 'Star this option') +
        '">' +
        '<span class="star-glyph" aria-hidden="true"></span>' +
        '</button>' +
        '<span class="slots">' +
        chips(o) +
        '</span>' +
        (ui.manage
            ? '<span class="o-act"><button class="icon-btn" data-act="edit" data-id="' +
              o.id +
              '" aria-label="Edit option">' +
              icon('edit') +
              '</button>' +
              '<button class="icon-btn" data-act="del-opt" data-id="' +
              o.id +
              '" aria-label="Delete option">' +
              icon('delete') +
              '</button></span>'
            : '') +
        '</div>'
    );
}

function renderOptions() {
    const s = active(),
        el = $('#optlist');
    if (!s || !el) return;
    const items = selectedItems(),
        q = ui.filter.trim().toLowerCase();
    const groups = [
        ['theory', 'Theory options'],
        ['lab', 'Lab options'],
    ];
    let html = '';
    groups.forEach((gr) => {
        const g = gr[0];
        const all = s.options.filter((o) => groupOf(o) === g);
        if (!all.length) return;
        const list = all
            .filter((o) => {
                if (
                    q &&
                    (o.faculty + ' ' + o.slots.join(' ') + ' ' + o.venue).toLowerCase().indexOf(q) <
                        0
                )
                    return false;
                if (state.hideClash && s.sel[g] !== o.id && conflictFor(s, g, o, items))
                    return false;
                return true;
            })
            .sort(
                (a, b) =>
                    Number(state.starredOptions.includes(facultySlotKey(b))) -
                    Number(state.starredOptions.includes(facultySlotKey(a)))
            );
        html +=
            '<div class="grp-h"><span class="eyebrow">' +
            gr[1] +
            '</span><span class="cnt">' +
            list.length +
            (list.length !== all.length ? ' of ' + all.length : '') +
            '</span></div>' +
            '<div class="opts" role="radiogroup" aria-label="' +
            gr[1] +
            '">' +
            (list.length
                ? list.map((o) => optionHtml(s, g, o, items)).join('')
                : '<div class="none">Nothing matches. Clear the search or show clashing options.</div>') +
            '</div>';
    });
    if (!html) html = '<div class="none">No options yet. Add an option by hand.</div>';
    el.innerHTML = html;
}

function renderPanel() {
    const el = $('#panel'),
        s = active(),
        top = el.scrollTop;
    if (!s) {
        el.innerHTML =
            '<div class="empty-p"><h2>Which subject are you planning?</h2><p>Add a subject, then choose from its available faculty and slot options or add an option by hand.</p>' +
            (ui.presetError ? '<div class="note">' + esc(ui.presetError) + '</div>' : '') +
            '<form data-form="add-subject" style="display:grid;gap:8px"><label class="lbl" for="newSubP">Subject name<input class="field" id="newSubP" name="name" placeholder="e.g. Operating Systems or CSE2005" autocomplete="off"></label>' +
            '<button class="btn primary" type="submit">Add subject</button></form></div>';
        return;
    }
    const th = s.options.find((o) => o.id === s.sel.theory),
        lb = s.options.find((o) => o.id === s.sel.lab);
    const pick = (o, g) =>
        '<div class="picked"><div class="pk"><b>' +
        esc(o.faculty) +
        '</b><small>' +
        esc(o.slots.join('+')) +
        (o.venue ? ' · ' + esc(o.venue) : '') +
        '</small></div>' +
        '<button class="icon-btn" data-act="unpick" data-g="' +
        g +
        '" aria-label="Remove ' +
        g +
        ' pick" style="color:inherit">' +
        icon('close', 18) +
        '</button></div>';
    el.innerHTML =
        '<div class="p-sec"><div class="eyebrow">Subject</div>' +
        (ui.renaming
            ? '<form class="edit" data-form="rename"><label class="lbl" for="r-name">Name<input class="field" id="r-name" name="name" value="' +
              esc(s.name) +
              '"></label><label class="lbl" for="r-code">Course code (optional)<input class="field" id="r-code" name="code" value="' +
              esc(s.code || '') +
              '" placeholder="CSE2005"></label><div class="acts"><button class="btn primary sm" type="submit">Save</button><button class="btn sm" type="button" data-act="rename-cancel">Cancel</button></div></form>'
            : '<div class="p-title"><span class="dot" style="--sc:' +
              s.color +
              ';margin-top:9px"></span><h2>' +
              esc(s.name) +
              '</h2><button class="icon-btn" data-act="rename" aria-label="Rename subject">' +
              icon('edit') +
              '</button></div>' +
              (s.code ? '<div><span class="code">' + esc(s.code) + '</span></div>' : '')) +
        '<div class="eyebrow" style="margin-top:4px">Your pick</div>' +
        (th || lb
            ? (th ? pick(th, 'theory') : '') + (lb ? pick(lb, 'lab') : '')
            : '<div class="none">Nothing picked yet. Choose a faculty below.</div>') +
        '</div>' +
        '<div class="p-sec"><div class="tools"><input class="field" id="filter" type="search" placeholder="Search faculty or slot" value="' +
        esc(ui.filter) +
        '" aria-label="Search options">' +
        '<button class="icon-btn' +
        (ui.manage ? ' on' : '') +
        '" data-act="manage" aria-pressed="' +
        ui.manage +
        '" aria-label="Edit or delete options" title="Edit or delete options">' +
        icon('edit') +
        '</button></div>' +
        '<label class="chk"><input type="checkbox" id="hideClash"' +
        (state.hideClash ? ' checked' : '') +
        '>Hide options that clash with my picks</label>' +
        '<div id="optlist" style="display:grid;gap:10px"></div>' +
        '<details class="fold" data-fold="manual"' +
        (ui.foldManual ? ' open' : '') +
        '><summary>' +
        icon('chevron_right', 18).replace('class="ms"', 'class="ms ch"') +
        'Add an option by hand</summary><form class="in" data-form="add-opt">' +
        '<label class="lbl" for="m-fac">Faculty<input class="field" id="m-fac" name="faculty" placeholder="Dr. Name Surname" autocomplete="off"></label>' +
        '<div class="edit"><div class="row"><label class="lbl" for="m-slots">Slots<input class="field" id="m-slots" name="slots" placeholder="A1+TA1" autocomplete="off"></label><label class="lbl" for="m-venue">Venue<input class="field" id="m-venue" name="venue" placeholder="SJT-711" autocomplete="off"></label></div></div>' +
        '<button class="btn primary sm" type="submit" style="justify-self:start">Add option</button></form></details>' +
        '</div>';
    renderOptions();
    el.scrollTop = top;
}

const renderBoard = createBoardRenderer({
    state,
    ui,
    active,
    analyse,
    label,
    shortName,
    icon,
    esc,
});
function renderTop(an) {
    const s = active(),
        c = $('#crumb');
    if (s) {
        c.hidden = false;
        c.innerHTML =
            '<span class="dot" style="--sc:' +
            s.color +
            '"></span><span class="t">' +
            esc(s.name) +
            '</span>';
    } else c.hidden = true;
    const st = $('#stat');
    const indicator = (group, name) => {
        const applicable = state.subjects.filter((subject) =>
            subject.options.some((option) => groupOf(option) === group)
        );
        const chosen = applicable.filter((subject) =>
            subject.options.some(
                (option) => groupOf(option) === group && option.id === subject.sel[group]
            )
        );
        const remaining = applicable.filter((subject) => !chosen.includes(subject));
        const subjectList = (subjects) =>
            subjects.length
                ? '<ul>' +
                  subjects
                      .map(
                          (subject) =>
                              '<li style="--sc:' +
                              subject.color +
                              '">' +
                              esc(subject.name) +
                              '</li>'
                      )
                      .join('') +
                  '</ul>'
                : '<p>None</p>';
        return (
            '<span class="stat-part ' +
            group +
            '" tabindex="0" aria-describedby="stat-' +
            group +
            '-tooltip">' +
            name +
            ' ' +
            chosen.length +
            '/' +
            applicable.length +
            '<span class="stat-tooltip" id="stat-' +
            group +
            '-tooltip" role="tooltip"><b>' +
            name +
            ' chosen</b>' +
            subjectList(chosen) +
            '<b>' +
            name +
            ' left to choose</b>' +
            subjectList(remaining) +
            '</span>' +
            '</span>'
        );
    };
    st.className = 'stat';
    st.innerHTML =
        indicator('theory', 'Theory') +
        indicator('lab', 'Lab') +
        (an.count
            ? '<span class="stat-clashes" title="' +
              an.count +
              (an.count === 1 ? ' clash' : ' clashes') +
              '">' +
              icon('error', 16) +
              an.count +
              '</span>'
            : '');
}
function render() {
    const an = analyse();
    renderTop(an);
    renderDrawer(an);
    renderPanel();
    renderBoard(an);
    if (!ui.presetError || state.subjects.length) save();
}

/* ---------- actions ---------- */
function effTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
}
function paintThemeBtn() {
    const d = effTheme() === 'dark',
        b = $('#themeBtn');
    b.innerHTML = icon(d ? 'light_mode' : 'dark_mode');
    b.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode');
    b.title = d ? 'Switch to light mode' : 'Switch to dark mode';
}
function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try {
        localStorage.setItem(STORAGE_KEY + '-theme', t);
    } catch (e) {
        /* ignore */
    }
    paintThemeBtn();
}
function initTheme() {
    try {
        const t = localStorage.getItem(STORAGE_KEY + '-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
        /* ignore */
    }
    paintThemeBtn();
}
let toastT;
function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('on'), 3200);
}
function openDrawer() {
    $('#drawer').classList.add('on');
    $('#scrim').classList.add('on');
    $('#drawer').setAttribute('aria-hidden', 'false');
    $('#menuBtn').setAttribute('aria-expanded', 'true');
    setTimeout(() => {
        const i = $('#newSubD');
        if (i) i.focus();
    }, 230);
}
function closeDrawer() {
    $('#drawer').classList.remove('on');
    $('#scrim').classList.remove('on');
    $('#drawer').setAttribute('aria-hidden', 'true');
    $('#menuBtn').setAttribute('aria-expanded', 'false');
}
function sheetText() {
    const lines = [];
    state.subjects.forEach((s) => {
        const t = s.options.find((o) => o.id === s.sel.theory),
            l = s.options.find((o) => o.id === s.sel.lab);
        if (!t && !l) return;
        lines.push(s.name + (s.code ? ' (' + s.code + ')' : ''));
        if (t)
            lines.push(
                '  Theory: ' +
                    t.faculty +
                    ' · ' +
                    t.slots.join('+') +
                    (t.venue ? ' · ' + t.venue : '')
            );
        if (l)
            lines.push(
                '  Lab: ' + l.faculty + ' · ' + l.slots.join('+') + (l.venue ? ' · ' + l.venue : '')
            );
    });
    return lines.length ? lines.join('\n') : 'No faculty picked yet.';
}
function addSubject(name) {
    name = (name || '').trim();
    if (!name) {
        toast('Type a subject name first.');
        return;
    }
    ui.presetError = '';
    const cm = name.match(CODE_RE);
    const s = {
        id: uid(),
        name: name,
        code: cm ? cm[0] : '',
        color: COLORS[state.subjects.length % COLORS.length],
        options: [],
        sel: { theory: null, lab: null },
    };
    state.subjects.push(s);
    state.activeId = s.id;
    ui.filter = '';
    ui.editing = null;
    ui.renaming = false;
    closeDrawer();
    render();
    toast('Added ' + name + '. Choose a faculty option or add one by hand.');
}
document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act,
        id = t.dataset.id,
        s = active();
    if (act === 'theme') {
        applyTheme(effTheme() === 'dark' ? 'light' : 'dark');
        return;
    }
    if (act === 'open-drawer') return openDrawer();
    if (act === 'close-drawer') return closeDrawer();
    if (act === 'reset-plan') {
        resetSelections();
        return;
    }
    if (act === 'star-option' && s) {
        const option = s.options.find((item) => item.id === id);
        if (!option) return;
        const key = facultySlotKey(option);
        state.starredOptions = state.starredOptions.includes(key)
            ? state.starredOptions.filter((starred) => starred !== key)
            : [...state.starredOptions, key];
        render();
        return;
    }
    if (act === 'pick') {
        state.activeId = id;
        ui.editing = null;
        ui.renaming = false;
        ui.filter = '';
        closeDrawer();
        render();
        return;
    }
    if (act === 'del-sub') {
        if (ui.confirmDel !== id) {
            ui.confirmDel = id;
            renderDrawer(analyse());
            return;
        }
        ui.confirmDel = null;
        state.subjects = state.subjects.filter((x) => x.id !== id);
        if (state.activeId === id)
            state.activeId = state.subjects.length ? state.subjects[0].id : null;
        render();
        return;
    }
    if (act === 'sel' && s) {
        if (e.target.closest('.o-act')) return;
        const g = t.dataset.g;
        s.sel[g] = s.sel[g] === id ? null : id;
        render();
        return;
    }
    if (act === 'unpick' && s) {
        s.sel[t.dataset.g] = null;
        render();
        return;
    }
    if (act === 'manage') {
        ui.manage = !ui.manage;
        ui.editing = null;
        renderPanel();
        return;
    }
    if (act === 'edit') {
        ui.editing = id;
        renderPanel();
        const f = $('#e-fac');
        if (f) f.focus();
        return;
    }
    if (act === 'cancel-edit') {
        ui.editing = null;
        renderPanel();
        return;
    }
    if (act === 'del-opt' && s) {
        s.options = s.options.filter((o) => o.id !== id);
        ['theory', 'lab'].forEach((g) => {
            if (s.sel[g] === id) s.sel[g] = null;
        });
        ui.preview = null;
        render();
        return;
    }
    if (act === 'rename') {
        ui.renaming = true;
        renderPanel();
        const f = $('#r-name');
        if (f) f.focus();
        return;
    }
    if (act === 'rename-cancel') {
        ui.renaming = false;
        renderPanel();
        return;
    }
    if (act === 'open-sheet') {
        $('#sheetPre').textContent = sheetText();
        $('#sheet').hidden = false;
        return;
    }
    if (act === 'close-sheet') {
        $('#sheet').hidden = true;
        return;
    }
    if (act === 'copy-sheet') {
        const txt = sheetText();
        const fail = () => {
            const r = document.createRange();
            r.selectNodeContents($('#sheetPre'));
            const sl = getSelection();
            sl.removeAllRanges();
            sl.addRange(r);
            toast('Copy was blocked. The text is selected, press Ctrl+C.');
        };
        try {
            navigator.clipboard.writeText(txt).then(() => toast('Plan copied.'), fail);
        } catch (er) {
            fail();
        }
        return;
    }
});

document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]');
    if (!f) return;
    e.preventDefault();
    const kind = f.dataset.form,
        s = active(),
        d = new FormData(f);
    if (kind === 'add-subject') {
        addSubject(d.get('name'));
        return;
    }
    if (!s) return;
    if (kind === 'rename') {
        const n = String(d.get('name') || '').trim();
        if (n) s.name = n;
        s.code = String(d.get('code') || '')
            .trim()
            .toUpperCase();
        ui.renaming = false;
        render();
        return;
    }
    if (kind === 'edit-opt') {
        const o = s.options.find((x) => x.id === f.dataset.id);
        if (!o) return;
        const sl = parseSlotString(d.get('slots'));
        if (!sl.length) {
            toast('Enter at least one valid slot, such as A1+TA1.');
            return;
        }
        o.faculty = String(d.get('faculty') || '').trim() || o.faculty;
        o.slots = sl;
        o.venue = String(d.get('venue') || '').trim();
        o.kind = kindOf(sl);
        ['theory', 'lab'].forEach((g) => {
            if (s.sel[g] === o.id && groupOf(o) !== g) s.sel[g] = null;
        });
        ui.editing = null;
        render();
        return;
    }
    if (kind === 'add-opt') {
        const fac = String(d.get('faculty') || '').trim(),
            sl = parseSlotString(d.get('slots'));
        if (!fac) {
            toast('Enter the faculty name.');
            return;
        }
        if (!sl.length) {
            toast('Enter at least one valid slot, such as A1+TA1.');
            return;
        }
        s.options.push({
            id: uid(),
            faculty: fac,
            slots: sl,
            venue: String(d.get('venue') || '').trim(),
            kind: kindOf(sl),
        });
        ui.foldManual = true;
        render();
        toast('Option added.');
        const m = $('#m-fac');
        if (m) m.focus();
    }
});

document.addEventListener('input', (e) => {
    if (e.target.id === 'filter') {
        ui.filter = e.target.value;
        renderOptions();
    }
});
document.addEventListener('change', (e) => {
    if (e.target.id === 'hideClash') {
        state.hideClash = e.target.checked;
        renderOptions();
        save();
    }
});
document.addEventListener(
    'toggle',
    (e) => {
        const d = e.target;
        if (!d.dataset || !d.dataset.fold) return;
        if (d.dataset.fold === 'manual') ui.foldManual = d.open;
    },
    true
);

/* hover preview */
document.addEventListener('mouseover', (e) => {
    const o = e.target.closest('.opt[data-id]');
    const id = o ? o.dataset.id : null;
    if (id !== ui.preview) {
        ui.preview = id;
        renderBoard();
    }
});
document.addEventListener('focusin', (e) => {
    const o = e.target.closest('.opt[data-id]');
    const id = o ? o.dataset.id : null;
    if (id !== ui.preview) {
        ui.preview = id;
        renderBoard();
    }
});
$('#panel').addEventListener('mouseleave', () => {
    if (ui.preview) {
        ui.preview = null;
        renderBoard();
    }
});

/* keyboard on options */
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeDrawer();
        $('#sheet').hidden = true;
        return;
    }
    const o = e.target.closest && e.target.closest('.opt[data-act="sel"]');
    if (o && e.target === o && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        o.click();
    }
});

async function initialize() {
    initTheme();
    try {
        const preset = await loadPreset();
        state.subjects = preset.subjects;
        state.activeId = preset.activeId;
        state.subjects.forEach((subject) => {
            const saved = cached.selections[subjectCacheKey(subject)];
            if (!saved || typeof saved !== 'object') return;
            ['theory', 'lab'].forEach((group) => {
                const option = subject.options.find(
                    (item) => groupOf(item) === group && optionCacheKey(item) === saved[group]
                );
                if (option) subject.sel[group] = option.id;
            });
        });
    } catch (error) {
        console.error('Could not load the bundled subject preset.', error);
        ui.presetError =
            'Could not load the bundled subject preset. Check that the app is served over HTTP, then reload or add a subject manually.';
        toast('Could not load the bundled subject preset.');
    }
    if (!state.subjects.some((s) => s.id === state.activeId))
        state.activeId = state.subjects.length ? state.subjects[0].id : null;
    render();
}

initialize();

</script></body></html>
